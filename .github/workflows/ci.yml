name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  contract-and-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project and development checks
        run: python -m pip install -e ".[dev]"
      - name: Run unit and contract tests
        run: python -m unittest discover -s tests -v
      - name: Check generated schemas are synchronized
        run: python scripts/generate_contract_schemas.py --check
