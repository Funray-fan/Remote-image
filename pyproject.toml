[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "remote-image"
version = "0.2.0"
description = "遥感灾损评估与救援决策辅助系统的模块化框架"
requires-python = ">=3.10"
dependencies = ["jsonschema>=4.21,<5"]

[project.optional-dependencies]
gis = [
    "rasterio>=1.3",
    "geopandas>=0.14",
    "pyogrio>=0.7",
]
ui = [
    "streamlit>=1.32",
    "leafmap>=0.31",
]
dev = [
    "pytest>=8.0",
]

[project.scripts]
remote-image = "remote_image.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
remote_image = ["schema_data/v2/*.json"]

